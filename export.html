<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saving photos — Maxwell</title>
    <style>
      body {
        background: #0a0a0b;
        color: #ece7df;
        font-family: Georgia, serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }
      .panel {
        max-width: 520px;
        padding: 2rem;
        border: 1px solid rgba(236, 231, 223, 0.15);
      }
      h1 { font-weight: 300; letter-spacing: 0.1em; }
      p { color: #a8a29a; line-height: 1.6; }
      #status { font-size: 1.15rem; color: #c9a86a; font-style: italic; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Saving your photos</h1>
      <p>
        Copying every photo and its details out of the browser into the
        project folder. This runs by itself — leave the page open.
      </p>
      <p id="status">Starting…</p>
    </div>

    <script type="module">
      import { getAllPhotos } from '/src/db.js';

      const status = document.getElementById('status');
      const extFor = (t) => (t === 'image/png' ? 'png' : 'jpg');

      async function send(name, body) {
        const res = await fetch('/api/save-photo', {
          method: 'POST',
          headers: { 'X-Filename': name },
          body,
        });
        if (!res.ok) throw new Error(`Saving ${name} failed (${res.status})`);
      }

      (async () => {
        try {
          const photos = await getAllPhotos();
          if (!photos.length) {
            status.textContent =
              'No photos found in this browser — is this the browser you added them in?';
            return;
          }

          const manifest = { photos: [] };
          let done = 0;
          for (const p of photos) {
            const file = `${p.id}.${extFor(p.type)}`;
            await send(file, p.blob);
            manifest.photos.push({
              file,
              title: p.title || p.name || 'Untitled',
              category: p.category || 'Unsorted',
              description: p.description || '',
              location: p.location || '',
              camera: p.camera || '',
              lens: p.lens || '',
              settings: p.settings || '',
              type: p.type || 'image/jpeg',
              width: p.width || 0,
              height: p.height || 0,
              addedAt: p.addedAt || 0,
            });
            done++;
            status.textContent = `Saving… ${done} of ${photos.length}`;
          }

          await send('photos.json', JSON.stringify(manifest, null, 2));
          status.textContent = `All done — ${done} photos saved. You can close this tab.`;
          document.title = 'Done — photos saved';
        } catch (err) {
          console.error(err);
          status.textContent = `Something went wrong: ${err.message}`;
        }
      })();
    </script>
  </body>
</html>
